name: Build installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pyinstaller packaging/pyinstaller.spec
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\setup.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: RVTripVisualizer-windows-installer
          path: dist/installer/RVTripVisualizer-Setup.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pyinstaller packaging/pyinstaller.spec
      - run: packaging/linux/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: RVTripVisualizer-linux-appimage
          path: dist/RVTripVisualizer-x86_64.AppImage

  # A single rolling "latest" release, no GitHub account or `gh` CLI needed
  # to get the installers - action-gh-release updates (not recreates) the
  # existing release/tag when given the same tag_name, so this just keeps
  # replacing the same two file names on every push to main. Stable public
  # download links (never change, always serve whatever this job last
  # uploaded):
  #   https://github.com/<owner>/<repo>/releases/latest/download/RVTripVisualizer-Setup.exe
  #   https://github.com/<owner>/<repo>/releases/latest/download/RVTripVisualizer-x86_64.AppImage
  # A real "v*" tag still works too (e.g. `git tag v0.2.0 && git push --tags`)
  # and creates its own separate, permanently pinned release - useful later
  # if stable version history matters, not required for "latest" to work.
  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish/update the "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Automatically rebuilt from ${{ github.sha }} on every push to main.
          prerelease: false
          make_latest: true
          files: |
            artifacts/RVTripVisualizer-windows-installer/RVTripVisualizer-Setup.exe
            artifacts/RVTripVisualizer-linux-appimage/RVTripVisualizer-x86_64.AppImage
      - name: Publish a versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/RVTripVisualizer-windows-installer/RVTripVisualizer-Setup.exe
            artifacts/RVTripVisualizer-linux-appimage/RVTripVisualizer-x86_64.AppImage
