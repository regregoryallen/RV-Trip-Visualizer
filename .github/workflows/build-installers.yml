name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pyinstaller packaging/pyinstaller.spec
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\setup.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: RVTripVisualizer-windows-installer
          path: dist/installer/RVTripVisualizer-Setup.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pyinstaller packaging/pyinstaller.spec
      - run: packaging/linux/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: RVTripVisualizer-linux-appimage
          path: dist/RVTripVisualizer-x86_64.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release and attach installers
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/RVTripVisualizer-windows-installer/RVTripVisualizer-Setup.exe
            artifacts/RVTripVisualizer-linux-appimage/RVTripVisualizer-x86_64.AppImage
